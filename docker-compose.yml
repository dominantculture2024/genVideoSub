version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - SERVER_PORT=8080
      - STORAGE_PATH=/app/data
      - TEMP_PATH=/app/temp
    volumes:
      - ./backend/data:/app/data
      - ./backend/temp:/app/temp
      - ./backend/config:/app/config
    networks:
      - genVideoSub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - API_BASE_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - genVideoSub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  genVideoSub-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  backend-temp:
    driver: local